<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancelar()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ esEdicion ? 'Editar cuenta' : 'Nueva cuenta' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Preview -->
  <div class="preview-card">
    <div class="preview-icon" [style.background]="colorSel + '33'">
      <ion-icon [name]="iconoSel" [style.color]="colorSel" size="large"></ion-icon>
    </div>
    <span class="preview-nombre">{{ nombre || 'Mi cuenta' }}</span>
  </div>

  <!-- Nombre -->
  <div class="form-card">
    <ion-item lines="none">
      <ion-label style="margin-top: 10px;" position="stacked">Nombre</ion-label>
      <ion-input
        [(ngModel)]="nombre"
        placeholder="Ej: Tarjeta de crédito"
        maxlength="20">
      </ion-input>
    </ion-item>
  </div>

  <!-- Selector de ícono -->
  <div class="seccion-label">Ícono</div>
  <div class="iconos-grid">
    @for (icono of iconos; track icono.nombre) {
      <div class="icono-item"
        [class.selected]="iconoSel === icono.nombre"
        [style.--sel-color]="colorSel"
        (click)="iconoSel = icono.nombre">
        <ion-icon [name]="icono.nombre"></ion-icon>
        <small>{{ icono.label }}</small>
      </div>
    }
  </div>

  <!-- Selector de color -->
  <div class="seccion-label">Color</div>
  <div class="colores-row">
    @for (color of colores; track color) {
      <div class="color-item"
        [style.background]="color"
        [class.selected]="colorSel === color"
        (click)="colorSel = color">
        @if (colorSel === color) {
          <ion-icon name="checkmark-outline" style="color:#fff; font-size:16px"></ion-icon>
        }
      </div>
    }
  </div>
  <ion-button
    expand="block"
    (click)="guardar()"
    [disabled]="!nombre.trim()"
    [style.--background]="colorSel">
    {{ esEdicion ? 'Guardar cambios' : 'Crear cuenta' }}
  </ion-button>
</ion-content>

<ion-footer class="ion-padding">
</ion-footer>
